name: Verify browser application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .dev/python
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.dev/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install --target .dev/python -r requirements-dev.txt
      - run: python -m playwright install --with-deps --only-shell chromium firefox
      - run: python -m pytest -q
      - run: python tools/package.py
      - run: python tools/package.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: browser-package
          path: dist/
